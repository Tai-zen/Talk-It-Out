<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>
  <link rel="stylesheet" href="../static/password.css" />
</head>
<body>

  <div class="container-card">
    <h1 class="title">Reset Your Password</h1>
    <p class="subtitle">
      Enter the email address associated with your account and we'll send you a password reset link.
    </p>

    <!-- Message Area -->
    <div id="resetMessage" class="message hidden"></div>

    <form id="resetForm">
      <!-- Email Input -->
      <div class="form-group">
        <label for="email" class="label">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" class="input"/>
      </div>

      <button type="submit" id="resetPasswordBtn" class="btn">
        Send Reset Link
      </button>
    </form>
    
    <div class="login-link">
      <a href="./login.html">Remembered your password? Log In</a>
    </div>
  </div>

  <script type="module" defer src="../static/password.js"></script>
</body>
</html>
