<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Sign Up Page - Lilac Theme</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
  <style>
/* --- Base Styles --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Nunito", sans-serif;
}

body {
  background: #f7f3ff;
  display: flex;
  flex-direction: row;
  height: 100vh;
}

/* LEFT SECTION */
.left {
  flex: 1;
  background: #ffffff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 60px;
  position: relative;
}

.left h1 {
  padding-top: 30px;
  font-size: 2.8rem;
  color: #3b2b59;
  font-weight: 700;
  max-width: 350px;
  line-height: 1.3;
}

.left .signin-link {
  margin-top: 20px;
  color: #3b2b59;
  font-size: 1rem;
}

.left .signin-link a {
  color: #6b4fa7;
  font-weight: bold;
  text-decoration: none;
}

.left .signin-link a:hover {
  text-decoration: underline;
}

.left .image img {
  width: 100%;
  max-width: 400px;
  height: auto;
  margin-top: 30px;
  padding-left: 0;
}

/* RIGHT SECTION */
.right {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px;
  background: linear-gradient(135deg, #c7b3ff, #6940b6);
}

.login-box {
  width: 100%;
  max-width: 380px;
  background:linear-gradient(360deg, #6940b6, #c7b3ff);
  padding: 30px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
}

.Logo h1 {
  color: white;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 25px;
  font-weight: bold;
}

h2 {
  color: white;
  margin-bottom: 25px;
}

.input-box {
  position: relative;
  width: 100%;
}

.input-box input {
  width: 100%;
  height: 45px;
  border: 2px solid #fff;
  background:linear-gradient(135deg, #c7b3ff, #6940b6);
  border-radius: 12px;
  padding: 0 40px 0 15px;
  font-size: 1rem;
  margin-bottom: 20px;
  color: white;
  outline: none;
}

.input-box label {
  position: absolute;
  top: -18px;
  left: 10px;
  padding: 0 5px;
  color: white;
  font-size: 0.85rem;
}

.input-box .icon {
  position: absolute;
  right: 10px;
  top: 40%;
  transform: translateY(-50%);
  opacity: 0.7;
}

.eye {
  position: absolute;
  right: 5px;
  top: 40%;
  transform: translateY(-50%);
  opacity: 0.7;
  cursor: pointer;
  padding: 5px;
}



button {
  width: 100%;
  background: #3a2b5a;
  color: white;
  font-weight: bold;
  border: none;
  border-radius: 12px;
  height: 45px;
  margin-top: 10px;
  transition: 0.3s;
  cursor: pointer;
}

button:hover {
  background: #6343a8;
}

.social-section {
  text-align: center;
  margin-top: 15px;
  color: #3b2b59;
  font-size: 0.9rem;
}

.social-section p {
  color: black;
}

.social-icons {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin-top: 10px;
}

.social-icons img {
  width: 35px;
  height: 35px;
  border-radius: 8px;
  padding: 6px;
  background: #ffffff;
  border: 2px solid #bfa4ff;
}

.in-link {
  text-align: center;
  margin-top: 15px;
}

.in-link a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.in-link a:hover {
  text-decoration: underline;
}

.messageDiv {
  background: transparent;
  color: white;
  width: 100%;
  padding: 8px;
  margin-bottom: 15px;
  border-radius: 8px;
  text-align: center;
  font-size: 0.9rem;
  display: none;
}

/* --- RESPONSIVE BREAKPOINTS --- */

/* Tablets */
@media (max-width: 1024px) {
  body {
    flex-direction: column;
  }
  .left {
    align-items: center;
    text-align: center;
    padding: 30px;
  }
  .left h1 {
    font-size: 2.2rem;
    max-width: 100%;
  }
  .left .image img {
    max-width: 300px;
  }
}

/* Mobile phones */
@media (max-width: 768px) {
  .left {
    display: none;
  }
  .right {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
  }
  .login-box {
    max-width: 100%;
    padding: 20px;
  }
  h2 {
    font-size: 1.5rem;
    text-align: center;
  }
}


/* Hide left section on tablets and smaller screens */
@media (max-width: 900px) {
  .left {
    display: none;   /* removes the left section */
  }
  body {
    flex-direction: column; /* stack everything vertically */
  }
  .right {
    width: 100%;
    min-height: 100vh;
    padding: 20px;
  }
  .login-box {
    max-width: 100%;
  }
}





/* Small phones */
@media (max-width: 480px) {
  .login-box {
    padding: 15px;
    border-radius: 12px;
  }
  .input-box input {
    height: 40px;
    font-size: 0.9rem;
  }
  button {
    height: 40px;
    font-size: 0.9rem;
  }
  .Logo h1 {
    font-size: 1.2rem;
  }

  
}

.reset a{
    display: flex;
    flex-direction:column;
    align-items: flex-end;
    width: 100%;
    padding: 5px;
    text-decoration: none;
    color: #fff;

  }

  .reset a:hover{
    text-decoration: underline;
    
  }

  </style>
</head>
<body>

  <div class="left">
    <h1>You're Not Alone. Talk, Play, Heal.</h1>
    <div class="signin-link">
      <p>Not a member? <a href="./register.html">Sign Up →</a></p>
    </div>
    <div class="image">
      <img src="../static/images/Talk it outt.png" alt="" >
    </div>
    
  </div>

  <section class="right">
    <div class="login-box">
      <div class="Logo">
        <h1><img src="../static/images/icons8-brain-48.png" width="25"> Talk It Out</h1>
      </div>

      <h2>Login</h2>

      <form id="form">
        <div id="signUpMessage" class="messageDiv"></div>


        <div class="input-box">
          <input type="email" id="email" required />
          <label>Email</label>
          <span class="icon"><img src="../static/images/mail_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" width="20"></span>
        </div>

        <div class="input-box">
          <input type="password" id="password" required />
          <label>Password</label>
          <span class="eye" onclick="togglePassword()">
            <img id="toggleIcon" src="../static/images/visibility_off_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.png" width="20" alt="Toggle Password">
          </span>
        </div>
        

        <button id="submit" type="submit">Login</button>
        <div class="reset">
          <a href="./password.html">Forgot password?</a>
        </div>

        <div class="social-section">
          <p>or login with</p>
        </div>

        <div class="social-icons">
          <a href=""><img src="../static/images/icons8-google-48.png"></a>
          <a href=""><img src="../static/images/icons8-apple-50.png"></a>
          

          
        </div>

        <div class="in-link">
          <p>Not a member? <a href="./register.html">Sign Up →</a></p>
        </div>
      </form>
    </div>
  </section>
  <script type="module" defer src="../static/login.js"></script>
</body>
</html>
