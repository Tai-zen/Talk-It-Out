<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Access Payment</title>

    <!-- ✅ Load Interswitch Payment Library -->
    <script src="https://newwebpay.interswitchng.com/inline-checkout.js"></script>

    <style>
        body {
            background-color: #121212;
            color: #fff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            margin-bottom: 25px;
            color: #ccc;
        }

        button {
            background-color: #ff9800;
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #ffa726;
        }
    </style>
</head>
<body>

    <h1>Get Unlimited Music Access 🎵</h1>
    <p>Pay a one-time fee of ₦1000 to access all songs forever.</p>
    <button id="payBtn">Pay ₦1000 Now</button>

    <script>
        // ✅ Callback after payment is complete
        function paymentCallback(response) {
            console.log("Payment Response:", response);

            // Check payment success (status may be SUCCESS, APPROVED, or 00)
            if (response && (response.status === "SUCCESS" || response.resp === "00")) {
                // Save payment access in localStorage
                localStorage.setItem("musicAccessGranted", "true");
                alert("✅ Payment successful! Redirecting to your music page...");
                window.location.href = "./sound.html";
            } else {
                alert("❌ Payment failed or cancelled. Please try again.");
            }
        }

        // ✅ When Pay Button is Clicked
        document.getElementById("payBtn").addEventListener("click", function() {
            // Create a unique transaction reference
            const txnRef = "txn_" + Date.now();

            // Create the payment request object
            const paymentRequest = {
                merchant_code: "MX153376",      // your merchant code
                pay_item_id: "7139718",       // your pay item ID
                txn_ref: txnRef,              // unique reference
                site_redirect_url: window.location.origin + "./sound.html", // redirect after payment
                amount: 5000,               // in kobo (₦1000 = 100000 kobo)
                currency: 566,                // NGN
                onComplete: paymentCallback,  // callback function
                mode: 'LIVE'                  // use 'LIVE' when going live
            };

            // ✅ Initialize Interswitch Checkout
            if (typeof window.webpayCheckout === "function") {
                window.webpayCheckout(paymentRequest);
            } else {
                alert("Payment gateway not loaded. Please check your internet connection.");
            }
        });
    </script>
    
</body>
</html>
