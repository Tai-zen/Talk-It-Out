<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Talk It Out- Your Virtual Companion</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      font-family: 'Nunito', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
    }

.navbar {
      width: 100%;
      padding: 1rem 2rem;
      background: #1f1f1f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style-type: none;
    }

    .nav-links a {
      color: #d5d6da;
      text-decoration: none;
      transition: 0.3s;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: #fff;
    }

    
    .hamburger {
      font-size: 2rem;
      display: none;
      color: #fff;
      cursor: pointer;
    }

   


/* Navbar */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: black;
  color: white;
  padding: 15px 20px;
  position: fixed;
  width: 100%;
  top: 0;
  z-index: 1000;
  box-shadow:0 0 5px 0 #1f1f1f;
}

.logo {
  font-size: 1.2rem;
  font-weight: bold;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 20px;
}

.nav-links li a {
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: color 0.3s ease;
}

.nav-links li a:hover {
  color:#6b4fa7;
}

/* Hamburger Icon */
.hamburger {
  display: none;
  font-size: 1.5rem;
  cursor: pointer;
}

/* Sidebar */
.sidebar {
  position: fixed;
  top: 0;
  right: -250px; /* Hidden by default */
  width: 250px;
  height: 100%;
  background: black;
  padding-top: 60px;
  transition: right 0.3s ease;
  z-index: 999;
}

.sidebar a {
  display: block;
  padding: 15px 20px;
  text-decoration: none;
  color: white;
  font-size: 1rem;
  transition: background 0.3s ease;
}

.sidebar a:hover {
  color: #6b4fa7;
}

.close-btn {
  position: absolute;
  top: 15px;
  right: 20px;
  font-size: 2rem;
  cursor: pointer;
  color: white;
}

/* Responsive Design */
@media (max-width: 768px) {
  .nav-links {
    display: none; /* Hide nav links on mobile */
  }

  .hamburger {
    display: block; /* Show hamburger icon */
  }
}
    .chat-container {
      width: 100%; max-width: 1000px; height: 100%;
      background-color: #3b3d3d; border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; margin-top: 10px;
    }
    .chat-header {
      background-color: #8e44ad; padding: 1rem; color: #fff;
      font-weight: bold; font-size: 1.2rem; text-align: left;
      display: flex; align-items: center;
    }
    .chat-messages {
      flex: 1; padding: 1rem; overflow-y: auto; display: flex;
      flex-direction: column; gap: 0.75rem;
    }
    .message {
      padding: 0.75rem 1rem; border-radius: 12px; max-width: 75%;
      font-size: 0.95rem; line-height: 1.4;
    }
    .user { background-color: #6b4fa769; color: #d5d6da; align-self: flex-end; }
    .bot { background-color: #8d44ad71; color: #d5d6da; align-self: flex-start; }
    .chat-input {
      display: flex; align-items: center; gap: 0.5rem;
      border-top: 1px solid #6b4fa7; background-color: #3b3d3d; padding: 0.5rem;
    }
    .chat-input input {
      flex: 1; padding: 1rem; border: none; background: transparent;
      color: #fff; font-size: 1rem; outline: none;
    }
    .chat-input button {
      background-color: #6b4fa7; border: none; color: #d5d6da;
      font-weight: bold; padding: 0.8rem 1.2rem; border-radius: 8px;
      cursor: pointer; transition: background 0.3s ease;
    }
    .chat-input button:hover { background-color: #604f8acc; }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">🧠 T I O Mental AI</div>
    <ul class="nav-links">
      <li><a href="./index.html">Home</a></li>
      <li><a href="./resources.html">Sound Lounge</a></li>
      <li><a href="./community.html">Community</a></li>
      <li><a href="/logout" class="logout-btn">Logout</a></li>
    </ul>
    <div class="hamburger" id="hamburger">&#9776;</div>
  </nav>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <span class="close-btn" id="closeBtn">&times;</span>
    <a href="./index.html">Home</a>
    <a href="./chat.html">Chat</a>
    <a href="./resources.html">Sound Lounge</a>
    <a href="./community.html">Community</a>
    <a href="/logout" class="logout-btn">Logout</a>
    </div>


  <div class="chat-container" id="chat">
    <div class="chat-header"> 🧠 T I O - Talk It Out</div>
    <div class="chat-messages" id="chatbox">
      <div class="message bot">Hi! I’m here to listen. How are you feeling today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type or speak..." />
      <button onclick="startListening()" id="startListening">🎙️</button>
      <button onclick="send()" id="send">Send</button>
      <button onclick="reportLastMessage()" id="reportLastMessage style="background-color: #8e44ad; color: #fff;">Report ⚠️</button>
    </div>
  </div>
<script type="module" src="../static/chat.js"></script>
<script>
const hamburger = document.getElementById("hamburger");
const sidebar = document.getElementById("sidebar");
const closeBtn = document.getElementById("closeBtn");

// Toggle sidebar when hamburger is clicked
hamburger.addEventListener("click", () => {
  if (sidebar.style.right === "0px") {
    sidebar.style.right = "-250px"; // Collapse
  } else {
    sidebar.style.right = "0"; // Expand
  }
});

// Close sidebar when close button is clicked
closeBtn.addEventListener("click", () => {
  sidebar.style.right = "-250px"; // Slide out
});

// Optional: Close sidebar when clicking outside
window.addEventListener("click", (e) => {
  if (e.target !== sidebar && e.target !== hamburger && !sidebar.contains(e.target)) {
    sidebar.style.right = "-250px";
  }
});


    </script>
</body>
</html>
